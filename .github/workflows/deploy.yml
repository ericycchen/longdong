name: Import & deploy

on:
  push:
    branches: [main]
  schedule:
    # 每天台灣時間 03:00 從 Google Sheet 同步
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Import from Google Sheet
        if: github.event_name != 'push'
        run: npm run import

      - name: Commit updated data
        if: github.event_name != 'push'
        run: |
          if git diff --quiet public/data; then
            echo "資料沒有變動"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data
            git commit -m "data: sync from Google Sheet"
            git push
          fi

      - run: npm test

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
